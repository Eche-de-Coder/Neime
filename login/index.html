<!DOCTYPE html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="dark" />
  <title>Neime - Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700&amp;family=JetBrains+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-surface-variant": "#e4beb1",
            "on-primary-fixed": "#370e00",
            "on-background": "#e4e1e6",
            "on-secondary-fixed": "#002021",
            "surface-container-lowest": "#0e0e11",
            "secondary-fixed": "#63f7ff",
            "outline-variant": "#5b4137",
            "primary-container": "#ff5c00",
            "tertiary-container": "#a27aff",
            "on-secondary-fixed-variant": "#004f53",
            "secondary": "#e6feff",
            "inverse-surface": "#e4e1e6",
            "surface-dim": "#131316",
            "on-tertiary-fixed-variant": "#5700c9",
            "surface-container-highest": "#353438",
            "primary-fixed-dim": "#ffb59a",
            "on-secondary-container": "#006c71",
            "surface-container-low": "#1b1b1e",
            "on-error": "#690005",
            "on-tertiary-fixed": "#23005b",
            "tertiary-fixed-dim": "#d1bcff",
            "tertiary": "#d1bcff",
            "error": "#ffb4ab",
            "on-error-container": "#ffdad6",
            "surface-container": "#1f1f22",
            "secondary-container": "#00f4fe",
            "on-secondary": "#003739",
            "on-primary": "#5a1b00",
            "outline": "#ab897d",
            "surface-variant": "#353438",
            "on-primary-container": "#521800",
            "primary-fixed": "#ffdbce",
            "on-tertiary": "#3c0090",
            "on-primary-fixed-variant": "#802a00",
            "tertiary-fixed": "#e9ddff",
            "inverse-primary": "#a73a00",
            "surface-container-high": "#2a2a2d",
            "secondary-fixed-dim": "#00dce5",
            "surface": "#131316",
            "on-surface": "#e4e1e6",
            "error-container": "#93000a",
            "surface-tint": "#ffb59a",
            "on-tertiary-container": "#360083",
            "surface-bright": "#39393c",
            "primary": "#ffb59a",
            "inverse-on-surface": "#303033",
            "background": "#131316"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "container-padding-desktop": "40px",
            "section-gap": "48px",
            "container-padding-mobile": "16px",
            "gutter": "24px",
            "unit": "8px",
            "safe": "env(safe-area-inset-bottom)"
          },
          "fontFamily": {
            "price-display": ["Hanken Grotesk"],
            "headline-lg-mobile": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "body-md": ["Hanken Grotesk"],
            "body-lg": ["Hanken Grotesk"],
            "headline-lg": ["Plus Jakarta Sans"],
            "label-sm": ["JetBrains Mono"],
            "display-xl": ["Plus Jakarta Sans"]
          },
          "fontSize": {

            "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],

            "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
            "display-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
          }
        }
      }
    }

  <style>
    .glass-panel {
      background: rgba(26, 26, 30, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .adire-pattern {
      background-image: radial-gradient(rgba(255, 92, 0, 0.05) 2px, transparent 2px),
        radial-gradient(rgba(255, 92, 0, 0.05) 2px, transparent 2px);
      background-position: 0 0, 20px 20px;
      background-size: 40px 40px;
    }
    
    .btn-glow:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-x-hidden antialiased adire-pattern" style="background-color:#131316;">
  <!-- Ambient Lighting Effect -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-primary-container/10 blur-[120px]"></div>
    <div class="absolute top-[40%] -right-[20%] w-[60%] h-[60%] rounded-full bg-secondary-container/5 blur-[150px]"></div>
  </div>
  <!-- Main Content Area -->
  <main class="flex-grow flex flex-col items-center justify-center p-container-padding-mobile md:p-container-padding-desktop z-10 w-full relative pb-[100px] md:pb-container-padding-desktop">
    <div class="w-full max-w-[420px] flex flex-col gap-8">
      <!-- Logo Header -->
      <div class="flex flex-col items-center text-center space-y-4">
        <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-surface-variant shadow-[0_0_24px_rgba(255,92,0,0.2)]">
          <img alt="Neime Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBL1ZdIvjLNHIljrRXpPQnm54N7ElihqjESpT3r8ZlJvCjyufEhacHG_0DnnoEjbigMQUYcz-lDGQvoyZCgBHH4xl3cebasbFdjK_r_u9UMzoxTOPiORTUzMuomrRrFHjHu-YRniFFCBkiYN9MJ3qTWFpe-FthIOTR2FXk3nUjTPP6KLRBR7F1A6l0YeHlierYXynh9PyvRN58xs6rUKl0ueuC4WbhcLP5__H8fUD3WxgfW3P11AyKXo5pFJOMDseOxag" />
        </div>
        <div>
          <h1 class="font-display-xl text-display-xl text-primary tracking-tight">Neime</h1>
          <p class="font-body-md text-body-md text-on-surface-variant mt-2">Sign in to your account</p>
        </div>
      </div>
      <!-- Login Form Card -->
      <div class="glass-panel rounded-2xl p-6 md:p-8 shadow-[0_16px_40px_rgba(0,0,0,0.4)]">
        <!-- Status banner (errors / success) -->
        <div class="hidden mb-4 rounded-lg px-4 py-3 font-body-md text-body-md" id="status-banner" role="alert"></div>
        
        <form class="flex flex-col gap-6" id="login-form">
          <div class="flex flex-col gap-1.5">
            <label class="font-label-sm text-label-sm text-on-surface uppercase" for="email">Email Address</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
              <input class="w-full bg-surface-container-low border border-surface-variant rounded-xl py-3.5 pl-12 pr-4 font-body-lg text-body-lg text-on-background placeholder:text-on-surface-variant/50 focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none transition-colors" id="email" name="email" placeholder="artist@neime.app" required="" type="email" />
            </div>
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="font-label-sm text-label-sm text-on-surface uppercase" for="password">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
              <input class="w-full bg-surface-container-low border border-surface-variant rounded-xl py-3.5 pl-12 pr-4 font-body-lg text-body-lg text-on-background placeholder:text-on-surface-variant/50 focus:border-secondary-container focus:ring-1 focus:ring-secondary-container focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password" />
            </div>
            <div class="flex justify-end mt-1">
              <a class="font-body-md text-body-md text-primary hover:text-primary-container transition-colors" href="forgot-password.html">Forgot Password?</a>
            </div>
          </div>
          <button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-full py-4 mt-2 hover:brightness-110 active:scale-95 transition-all drop-shadow-[0_0_16px_rgba(255,92,0,0.3)] flex items-center justify-center gap-2 btn-glow" id="submit-btn" type="submit">
            <span id="submit-label">Sign In</span>
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
          </button>
        </form>
      </div>
      <!-- Sign Up Link -->
      <div class="text-center font-body-md text-body-md text-on-surface-variant">
        New to Neime? <a class="text-secondary-fixed hover:text-secondary-container font-bold ml-1 transition-colors drop-shadow-[0_0_8px_rgba(0,244,254,0.3)]" href="signup.html">Create an Account</a>
      </div>
    </div>
  </main>
  
  <script src="../js/config.js"></script>
  <script>
    function showStatus(message, isError) {
      const banner = document.getElementById('status-banner');
      banner.textContent = message;
      banner.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'bg-secondary-container/20', 'text-secondary');
      banner.classList.add(isError ? 'bg-error-container' : 'bg-secondary-container/20', isError ? 'text-on-error-container' : 'text-secondary');
    }
    
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submit-btn');
      const submitLabel = document.getElementById('submit-label');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      submitBtn.disabled = true;
      submitLabel.textContent = 'Signing in…';
      
      const { data, error } = await window.sb.auth.signInWithPassword({ email, password });
      
      submitBtn.disabled = false;
      submitLabel.textContent = 'Sign In';
      
      if (error) {
        showStatus(error.message, true);
        return;
      }
      
      // Route by role stored in user_metadata at signup
      const role = data.user?.user_metadata?.role;
      showStatus('Signed in! Redirecting…', false);
      setTimeout(() => {
        window.location.href = role === 'artist' ? '../account/artist.html' : '../home';
      }, 600);
    });
    
    // If already logged in, bounce straight through
    window.sb.auth.getSession().then(({ data }) => {
      if (data.session) {
        // Optional: auto-redirect returning users. Comment out if you want
        // to let signed-in users land on the login page intentionally.
        // window.location.href = 'home.html';
      }
    });
  </script>
</body>

</html>
