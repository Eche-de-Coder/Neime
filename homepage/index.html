  <script>
    let currentUser = null;
    let playQueue = [];
    let currentSongIndex = -1;
    let currentSong = null;
    let songBeingBought = null;
    
    (async function initHome() {
      const { data: { session } } = await window.sb.auth.getSession();
      //if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session?.user || null;
      loadSongs();
    })();
    
    async function loadSongs() {
      const { data: songs, error } = await window.sb
        .from('songs')
        .select('*')
        .order('created_at', { ascending: false });
      
      if (error) { console.warn(error.message); return; }
      playQueue = songs || [];
      renderSongs(playQueue);
    }
    
    function renderSongs(songs) {
      const container = document.getElementById('trending-songs');
      const template = document.getElementById('song-card-template');
      container.innerHTML = '';
      
      songs.forEach(song => {
        const node = template.content.cloneNode(true);
        node.querySelector('[data-song-id]').dataset.songId = song.id;
        node.querySelector('.song-cover').src = song.cover_url || '';
        node.querySelector('.song-title').textContent = song.title;
        node.querySelector('.song-artist').textContent = song.feature ? `${song.artist_name} ft. ${song.feature}` : song.artist_name;
        node.querySelector('.song-price').textContent = `₦${song.price}`;
        node.querySelector('.song-play-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          handlePlayClick(song);
        });
        container.appendChild(node);
      });
    }
    
    // ── Purchase gate ──
    async function hasPurchased(songId) {
      const { data } = await window.sb
        .from('purchases')
        .select('id')
        .eq('buyer_id', currentUser.id)
        .eq('song_id', songId)
        .maybeSingle();
      return !!data;
    }
    
    async function handlePlayClick(song) {
      if (!currentUser) {
        openBuyModal(song);
        return;
      }
        
      const owned = await hasPurchased(song.id);
      owned ? playSong(song) : openBuyModal(song);
    }
    
    // ── Buy modal + Paystack ──
    const buyModal = document.getElementById('buy-modal');
    
    function openBuyModal(song) {
      songBeingBought = song;
      document.getElementById('buy-modal-cover').src = song.cover_url || '';
      document.getElementById('buy-modal-title').textContent = song.title;
      document.getElementById('buy-modal-artist').textContent = song.artist_name;
      document.getElementById('buy-modal-price').textContent = `₦${song.price}`;
      buyModal.classList.remove('hidden');
    }
    document.getElementById('buy-modal-cancel-btn').addEventListener('click', () => buyModal.classList.add('hidden'));
    document.getElementById('buy-modal-backdrop').addEventListener('click', () => buyModal.classList.add('hidden'));
    
    document.getElementById('buy-modal-pay-btn').addEventListener('click', () => {
      if (!currentUser) {
        window.location.href = '../login';
      return;
      }
      
      const song = songBeingBought;
      const handler = PaystackPop.setup({
        key: window.PAYSTACK_PUBLIC_KEY,
        email: currentUser.email,
        amount: Math.round(song.price * 100), // kobo
        currency: 'NGN',
        ref: `neime_${song.id}_${Date.now()}`,
        callback: (response) => verifyAndUnlock(response.reference, song),
        onClose: () => {}
      });
      handler.openIframe();
    });
    
    async function verifyAndUnlock(reference, song) {
      const { data, error } = await window.sb.functions.invoke('verify-paystack', {
        body: { reference, song_id: song.id, buyer_id: currentUser.id }
      });
      
      if (error || !data?.success) {
        alert('Payment verification failed: ' + (error?.message || data?.error || 'Unknown error'));
        return;
      }
      
      buyModal.classList.add('hidden');
      playSong(song);
    }
    
    // ── Player ──
    const audio = document.getElementById('audio-player');
    const playerModal = document.getElementById('player-modal');
    const miniPlayer = document.getElementById('mini-player');
    
    async function playSong(song) {
      currentSong = song;
      currentSongIndex = playQueue.findIndex(s => s.id === song.id);
      
      // "songs" bucket is private — mint a short-lived signed URL
      const { data, error } = await window.sb.storage.from('songs').createSignedUrl(song.audio_path, 3600);
      if (error) { alert('Could not load audio: ' + error.message); return; }
      
      audio.src = data.signedUrl;
      audio.play();
      
      document.getElementById('player-cover').src = song.cover_url || '';
      document.getElementById('player-title').textContent = song.title;
      document.getElementById('player-artist').textContent = song.artist_name;
      document.getElementById('mini-player-cover').src = song.cover_url || '';
      document.getElementById('mini-player-title').textContent = song.title;
      document.getElementById('mini-player-artist').textContent = song.artist_name;
      
      miniPlayer.classList.remove('hidden');
      playerModal.classList.remove('hidden');
      setPlayIcon(true);
    }
    
    function setPlayIcon(isPlaying) {
      document.getElementById('player-toggle-icon').textContent = isPlaying ? 'pause' : 'play_arrow';
      document.getElementById('mini-player-icon').textContent = isPlaying ? 'pause' : 'play_arrow';
    }
    
    document.getElementById('player-toggle-btn').addEventListener('click', () => {
      audio.paused ? (audio.play(), setPlayIcon(true)) : (audio.pause(), setPlayIcon(false));
    });
    document.getElementById('mini-player-toggle').addEventListener('click', (e) => {
      e.stopPropagation();
      audio.paused ? (audio.play(), setPlayIcon(true)) : (audio.pause(), setPlayIcon(false));
    });
    
    document.getElementById('player-modal-close').addEventListener('click', () => playerModal.classList.add('hidden'));
    miniPlayer.addEventListener('click', () => playerModal.classList.remove('hidden'));
    
    document.getElementById('player-next-btn').addEventListener('click', () => skip(1));
    document.getElementById('player-prev-btn').addEventListener('click', () => skip(-1));
    
    function skip(direction) {
      const nextIndex = currentSongIndex + direction;
      if (nextIndex >= 0 && nextIndex < playQueue.length) handlePlayClick(playQueue[nextIndex]);
    }
    
    function formatTime(seconds) {
      if (!isFinite(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }
    
    audio.addEventListener('timeupdate', () => {
      document.getElementById('player-current-time').textContent = formatTime(audio.currentTime);
      document.getElementById('player-seek').value = (audio.currentTime / audio.duration) * 100 || 0;
    });
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('player-duration').textContent = formatTime(audio.duration);
    });
    document.getElementById('player-seek').addEventListener('input', (e) => {
      audio.currentTime = (e.target.value / 100) * audio.duration;
    });
    audio.addEventListener('ended', () => skip(1));
  </script>
</body>

</html>
