  <main class="max-w-7xl mx-auto px-container-padding-mobile md:px-container-padding-desktop mt-section-gap">

  <script>
    (async function loadLibrary() {
      const { data: { session } } = await window.sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      
      const { data: purchases, error } = await window.sb
        .from('purchases')
        .select('id, amount, created_at, songs(id, title, artist_name, cover_url, audio_path)')
        .eq('buyer_id', session.user.id)
        .order('created_at', { ascending: false });
      
      if (error) { console.warn(error.message); return; }
      renderLibrary(purchases || []);
    })();
    
    function renderLibrary(purchases) {
      const list = document.getElementById('library-list');
      const empty = document.getElementById('library-empty-state');
      const template = document.getElementById('library-card-template');
      
      list.innerHTML = '';
      empty.classList.toggle('hidden', purchases.length > 0);
      
      purchases.forEach(p => {
        const song = p.songs;
        if (!song) return;
        const node = template.content.cloneNode(true);
        node.querySelector('.lib-cover').src = song.cover_url || '';
        node.querySelector('.lib-title').textContent = song.title;
        node.querySelector('.lib-artist').textContent = song.artist_name;
        node.querySelector('.lib-amount').textContent = `Purchased ₦${p.amount}`;
        node.querySelector('.lib-card').addEventListener('click', () => window.playSong(song));
        list.appendChild(node);
      });
    }
  </script>
