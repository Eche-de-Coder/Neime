<!DOCTYPE html>

<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <meta name="color-scheme" content="dark" />
  <title>Neime - Loading</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Hanken+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-container": "#ff5c00",
            "on-surface-variant": "#e4beb1",
            "surface": "#131316",
            "background": "#131316",
            "on-background": "#e4e1e6",
            "primary": "#ffb59a"
          },
          "fontFamily": {
            "display-xl": ["Plus Jakarta Sans"],
            "body-md": ["Hanken Grotesk"]
          },
          "fontSize": {
            "display-xl": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
          }
        }
      }
    }
  </script>
  <style>
    html,
    body {
      background-color: #131316;
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    
    .spinner {
      animation: spin 0.8s linear infinite;
    }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center gap-6">
  <h1 class="font-display-xl text-display-xl text-primary tracking-tight">Neime</h1>
  <div class="w-8 h-8 border-2 border-primary-container/30 border-t-primary-container rounded-full spinner"></div>
  <p class="font-body-md text-body-md text-on-surface-variant" id="status-text">Loading your account…</p>
  
  <script src="../js/config.js"></script>
  <script>
    (async function route() {
      const { data: { session }, error } = await window.sb.auth.getSession();
      
      if (error || !session) {
        document.querySelector(h1).classlist.add('hidden');
        return;
      }
      
      const role = session.user.user_metadata?.role;
      
      if (role === 'artist') {
        window.location.replace('artist.html');
      } else if (role === 'user') {
        window.location.replace('user.html');
      } else {
        const { data: artistRow } = await window.sb
          .from('artists')
          .select('id')
          .eq('id', session.user.id)
          .maybeSingle();
        
        window.location.replace(artistRow ? 'artist.html' : 'user.html');
      }
    })();
  </script>
</body>

</html>
