<script src="../tailwind.config.js">  </script>
  <style>
    html, body { background-color: #131316; }
    .btn-glow { box-shadow: 0 0 16px rgba(255, 92, 0, 0.3); }
    .btn-glow:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-sm text-center">
    <h1 class="font-display-xl text-display-xl text-primary tracking-tight mb-8">Neime</h1>

    <div id="loading-state">
      <p class="font-body-md text-body-md text-on-surface-variant">Loading track…</p>
    </div>

    <div class="hidden" id="not-found-state">
      <p class="font-body-md text-body-md text-on-surface-variant">This link doesn't match any track.</p>
      <a class="text-primary font-body-md text-body-md mt-4 inline-block" href="/">Go to Neime</a>
    </div>

    <div class="hidden" id="song-state">
      <img class="w-48 h-48 rounded-xl object-cover mx-auto mb-6 shadow-2xl" id="song-cover" src="" />
      <h2 class="font-headline-md text-headline-md text-on-surface mb-1" id="song-title">Title</h2>
      <p class="font-body-md text-body-md text-on-surface-variant mb-6" id="song-artist">Artist</p>

      <div class="hidden mb-4 rounded-lg px-4 py-3 font-body-md text-body-md" id="status-banner" role="alert"></div>

      <p class="font-price-display text-price-display text-primary mb-4" id="song-price">₦0</p>
      <button class="w-full bg-primary-container text-white font-headline-md text-headline-md !text-[16px] py-3 rounded-full btn-glow active:scale-95 transition-all" id="action-btn" type="button">
        Buy Track
      </button>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/player.js"></script>
  <script>
    let song = null;
    let currentUser = null;

    function showStatus(message, isError) {
      const b = document.getElementById('status-banner');
      b.textContent = message;
      b.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'bg-secondary-container/20', 'text-secondary');
      b.classList.add(isError ? 'bg-error-container' : 'bg-secondary-container/20', isError ? 'text-on-error-container' : 'text-secondary');
    }

    /**(async function init() {
      const code = new URLSearchParams(window.location.search).get('code');
      if (!code) { showNotFound(); return; }**/
    (async function init() {
  const code = new URLSearchParams(window.location.search).get('code');
  if (!code) { showNotFound(); return; }

  const { data, error } = await window.sb.from('songs').select('*').eq('share_code', code).maybeSingle();
  if (error || !data) { showNotFound(); return; }
      
      
      song = data;
      document.getElementById('song-cover').src = song.cover_url || '';
      document.getElementById('song-title').textContent = song.title;
      document.getElementById('song-artist').textContent = song.feature ? `${song.artist_name} ft. ${song.feature}` : song.artist_name;
      document.getElementById('song-price').textContent = `₦${song.price}`;

      const { data: { session } } = await window.sb.auth.getSession();
      currentUser = session?.user || null;

      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('song-state').classList.remove('hidden');

      if (currentUser) {
        const { data: owned } = await window.sb.from('purchases').select('id').eq('buyer_id', currentUser.id).eq('song_id', song.id).maybeSingle();
        if (owned) {
          document.getElementById('action-btn').textContent = 'Play Track';
        }
      }
    })();

    function showNotFound() {
      document.getElementById('loading-state').classList.add('hidden');
      document.getElementById('not-found-state').classList.remove('hidden');
    }

    document.getElementById('action-btn').addEventListener('click', async () => {
      if (!currentUser) {
        // send them to log in, then back to this exact share link
        window.location.href = `login.html?redirect=${encodeURIComponent(window.location.href)}`;
        return;
      }

      const { data: owned } = await window.sb.from('purchases').select('id').eq('buyer_id', currentUser.id).eq('song_id', song.id).maybeSingle();
      if (owned) { window.playSong(song); return; }

      const handler = PaystackPop.setup({
        key: window.PAYSTACK_PUBLIC_KEY,
        email: currentUser.email,
        amount: Math.round(song.price * 100),
        currency: 'NGN',
        ref: `neime_${song.id}_${Date.now()}`,
        callback: (response) => verifyAndUnlock(response.reference),
        onClose: () => {}
      });
      handler.openIframe();
    });

    async function verifyAndUnlock(reference) {
      const { data, error } = await window.sb.functions.invoke('verify-paystack', {
        body: { reference, song_id: song.id, buyer_id: currentUser.id }
      });
      if (error || !data?.success) {
        showStatus('Payment verification failed.', true);
        return;
      }
      document.getElementById('action-btn').textContent = 'Play Track';
      window.playSong(song);
    }
  </script>
</body>
</html>
