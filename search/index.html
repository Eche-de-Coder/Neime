<body class="bg-background text-on-background min-h-screen pb-[120px] md:pb-[100px] flex flex-col relative overflow-x-hidden">
  <!-- Top Navigation (Web Only) -->
  <header class="hidden md:flex justify-between items-center px-4 py-3 w-full bg-surface/80 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-white/10 shadow-sm">
    <div class="font-display-xl text-headline-md font-extrabold text-primary tracking-tight">
      Neime
    </div>
    <div class="flex gap-6 items-center">
      <!-- Active State (Search) is handled differently on desktop nav usually, but following JSON structure as best as possible for Top Nav -->
      <a class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center gap-2" href="#">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
        <span class="font-headline-md text-headline-md text-sm">Home</span>
      </a>
      <a class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center gap-2" href="#">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
        <span class="font-headline-md text-headline-md text-sm">Search</span>
      </a>
      <a class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform flex items-center gap-2" href="#">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">library_music</span>
        <span class="font-headline-md text-headline-md text-sm">My Music</span>
      </a>
      <div class="flex items-center gap-4 ml-4 pl-4 border-l border-white/10">
        <button class="text-on-surface-variant hover:text-primary transition-colors">
          <span class="material-symbols-outlined">notifications</span>
        </button>
        <button class="text-on-surface-variant hover:text-primary transition-colors">
          <span class="material-symbols-outlined">payments</span>
        </button>
        <div class="w-8 h-8 rounded-full overflow-hidden bg-surface-container-high border border-white/10">
          <img alt="Artist or User Profile" class="w-full h-full object-cover" data-alt="A close up portrait of an African musician bathed in moody stage lighting. Deep shadows and vibrant neon orange and teal highlights. Shot with a shallow depth of field. High quality, photorealistic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNq1H3DrjiKee0GhM1vbrXQ7jogQ7_iO7SuEFbL3YRyPhyZQ92BohesRapql2XkedB9bBCrNt4tMO5Qhps_TwjgQaAY3I2hsSZkO9YE_axPBDzbCEWjQqKjawQdeRqc5gs7FNTva-D6tH6JHmu3ZJGUJE5rcsbo9K_ExXJHmMutN1kwYvT701W02s0mlsnyf2CT97-DgSYD6Ar8palTL94AghztBfQufQWUa472OpCWGGLpGmf428c" />
        </div>
      </div>
    </div>
  </header>
  
  <!-- Main Content Canvas -->
  <main class="flex-1 w-full max-w-7xl mx-auto px-container-padding-mobile md:px-container-padding-desktop pt-8 md:pt-28 flex flex-col gap-section-gap">
    <!-- Search Header & Input -->
    <section class="flex flex-col gap-6">
      <h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">Explore</h1>
      <div class="relative w-full group">
        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
          <span class="material-symbols-outlined text-on-surface-variant group-focus-within:text-secondary-container transition-colors">search</span>
        </div>
        <input class="w-full bg-[#1A1A1E] text-on-surface font-body-md text-body-md rounded-xl py-4 pl-12 pr-4 border border-white/10 outline-none transition-all duration-300 input-glow placeholder:text-on-surface-variant/50" id="search-input" placeholder="Artists, songs, genres, or moods..." type="text" />
      </div>
    </section>
    <!-- Search Results -->
    <section class="flex flex-col gap-8">
      <div id="idle-state" class="text-center py-16">
        <span class="material-symbols-outlined text-5xl text-on-surface-variant/40 mb-3">search</span>
        <p class="font-body-md text-body-md text-on-surface-variant">Search for a song or artist to get started.</p>
      </div>
      
      <div class="hidden text-center py-16" id="no-results-state">
        <p class="font-body-md text-body-md text-on-surface-variant">No results found.</p>
      </div>
      
      <div class="hidden flex-col gap-4" id="songs-results-section">
        <h2 class="font-headline-md text-headline-md text-on-background text-lg">Songs</h2>
        <div class="flex flex-col gap-2" id="songs-results-list"></div>
      </div>
      
      <div class="hidden flex-col gap-4" id="artists-results-section">
        <h2 class="font-headline-md text-headline-md text-on-background text-lg">Artists</h2>
        <div class="flex flex-col gap-2" id="artists-results-list"></div>
      </div>
    </section>
    
  </main>
  
  <nav class="md:hidden bg-surface-dim/90 backdrop-blur-2xl fixed bottom-0 w-full z-50 pb-safe bg-surface-container-highest/50 border-t border-white/5 shadow-[0_-4px_24px_rgba(0,0,0,0.4)] flex justify-around items-center h-20 px-2">
    <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200" href="../homepage">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">home</span>
      <span class="font-label-sm text-label-sm mt-1">Home</span>
    </a>
    <a class="flex flex-col items-center justify-center text-primary-container font-bold drop-shadow-[0_0_8px_rgba(255,92,0,0.3)] hover:text-primary transition-colors active:scale-90 duration-200" href="#">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">search</span>
      <span class="font-label-sm text-label-sm mt-1">Search</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200" href="../library">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">library_music</span>
      <span class="font-label-sm text-label-sm mt-1">My Music</span>
    </a>
    <a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 duration-200" href="../account">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
      <span class="font-label-sm text-label-sm mt-1">Account</span>
    </a>
  </nav>
  
  <!-- templates -->
  <template id="search-song-template">
    <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-surface-container-high transition-colors group cursor-pointer border border-transparent hover:border-white/5 search-song-card">
      <div class="w-14 h-14 rounded-lg bg-surface-container-highest overflow-hidden shrink-0 relative">
        <img alt="Cover" class="w-full h-full object-cover ss-cover" src="" />
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
          <span class="material-symbols-outlined text-white text-[20px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
        </div>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="font-body-lg text-body-lg text-on-surface truncate ss-title">Title</h4>
        <p class="font-body-md text-body-md text-on-surface-variant truncate ss-artist">Artist</p>
      </div>
      <div class="bg-primary/10 text-primary-fixed-dim px-2 py-1 rounded-full font-label-sm text-label-sm border border-primary/20 shrink-0 ss-price">₦0</div>
    </div>
  </template>
  
  <template id="search-artist-template">
    <div class="flex items-center gap-4 p-3 rounded-lg hover:bg-surface-container-high transition-colors cursor-pointer border border-transparent hover:border-white/5 search-artist-card">
      <div class="w-12 h-12 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0">
        <span class="material-symbols-outlined text-on-surface-variant">mic</span>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="font-body-lg text-body-lg text-on-surface truncate sa-name">Artist</h4>
        <p class="font-label-sm text-label-sm text-on-surface-variant sa-count">0 tracks</p>
      </div>
    </div>
  </template>
  
  <div class="hidden fixed inset-0 z-[70] flex items-center justify-center p-4" id="buy-modal">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="buy-modal-backdrop"></div>
    <div class="relative w-full max-w-sm bg-surface-container-low border border-white/10 rounded-xl p-6 shadow-2xl text-center">
      <img class="w-24 h-24 rounded-lg object-cover mx-auto mb-4" id="buy-modal-cover" src="" />
      <h3 class="font-headline-md text-headline-md text-on-surface mb-1" id="buy-modal-title">Song Title</h3>
      <p class="font-body-md text-body-md text-on-surface-variant mb-6" id="buy-modal-artist">Artist</p>
      <p class="font-price-display text-price-display text-primary mb-6" id="buy-modal-price">₦0</p>
      <button class="w-full bg-primary-container text-white font-headline-md text-headline-md !text-[16px] py-3 rounded-full hover:opacity-90 active:scale-95 transition-all mb-3" id="buy-modal-pay-btn" type="button">
        Pay with Paystack
      </button>
      <button class="w-full text-on-surface-variant font-body-md text-body-md py-2" id="buy-modal-cancel-btn" type="button">
        Cancel
      </button>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/player.js"></script>
  <script>
    let currentUser = null;
    let songBeingBought = null;
    let searchDebounce;
    
    (async function initSearch() {
      const { data: { session } } = await window.sb.auth.getSession();
      if (!session) { window.location.href = 'login.html'; return; }
      currentUser = session.user;
    })();
    
    const searchInput = document.getElementById('search-input');
    searchInput.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      const q = searchInput.value.trim();
      
      if (!q) {
        showState('idle');
        return;
      }
      searchDebounce = setTimeout(() => runSearch(q), 300);
    });
    
    function showState(state) {
      document.getElementById('idle-state').classList.toggle('hidden', state !== 'idle');
      document.getElementById('no-results-state').classList.toggle('hidden', state !== 'empty');
      document.getElementById('songs-results-section').classList.toggle('hidden', true);
      document.getElementById('artists-results-section').classList.toggle('hidden', true);
    }
    
    async function runSearch(query) {
      // Match song titles OR artist names in one query
      const { data: songs, error } = await window.sb
        .from('songs')
        .select('*')
        .or(`title.ilike.%${query}%,artist_name.ilike.%${query}%`)
        .order('created_at', { ascending: false })
        .limit(30);
      
      if (error) { console.warn(error.message); return; }
      
      if (!songs || songs.length === 0) {
        showState('empty');
        return;
      }
      
      renderSongResults(songs, query);
      renderArtistResults(songs, query);
      
      document.getElementById('idle-state').classList.add('hidden');
      document.getElementById('no-results-state').classList.add('hidden');
    }
    
    function renderSongResults(songs, query) {
      const matches = songs.filter(s => s.title.toLowerCase().includes(query.toLowerCase()));
      const section = document.getElementById('songs-results-section');
      const list = document.getElementById('songs-results-list');
      const template = document.getElementById('search-song-template');
      
      section.classList.toggle('hidden', matches.length === 0);
      list.innerHTML = '';
      
      matches.forEach(song => {
        const node = template.content.cloneNode(true);
        node.querySelector('.ss-cover').src = song.cover_url || '';
        node.querySelector('.ss-title').textContent = song.title;
        node.querySelector('.ss-artist').textContent = song.feature ? `${song.artist_name} ft. ${song.feature}` : song.artist_name;
        node.querySelector('.ss-price').textContent = `₦${song.price}`;
        node.querySelector('.search-song-card').addEventListener('click', () => handlePlayClick(song));
        list.appendChild(node);
      });
    }
    
    function renderArtistResults(songs, query) {
      const artistMap = new Map();
      songs
        .filter(s => s.artist_name.toLowerCase().includes(query.toLowerCase()))
        .forEach(s => {
          if (!artistMap.has(s.artist_name)) artistMap.set(s.artist_name, 0);
          artistMap.set(s.artist_name, artistMap.get(s.artist_name) + 1);
        });
      
      const section = document.getElementById('artists-results-section');
      const list = document.getElementById('artists-results-list');
      const template = document.getElementById('search-artist-template');
      
      section.classList.toggle('hidden', artistMap.size === 0);
      list.innerHTML = '';
      
      artistMap.forEach((count, name) => {
        const node = template.content.cloneNode(true);
        node.querySelector('.sa-name').textContent = name;
        node.querySelector('.sa-count').textContent = `${count} track${count > 1 ? 's' : ''}`;
        node.querySelector('.search-artist-card').addEventListener('click', () => {
          searchInput.value = name;
          runSearch(name);
        });
        list.appendChild(node);
      });
    }
    
    // ── Purchase gate (same logic as home.html) ──
    async function hasPurchased(songId) {
      const { data } = await window.sb
        .from('purchases')
        .select('id')
        .eq('buyer_id', currentUser.id)
        .eq('song_id', songId)
        .maybeSingle();
      return !!data;
    }
    
    async function handlePlayClick(song) {
      const owned = await hasPurchased(song.id);
      owned ? window.playSong(song) : openBuyModal(song);
    }
    
    const buyModal = document.getElementById('buy-modal');
    
    function openBuyModal(song) {
      songBeingBought = song;
      document.getElementById('buy-modal-cover').src = song.cover_url || '';
      document.getElementById('buy-modal-title').textContent = song.title;
      document.getElementById('buy-modal-artist').textContent = song.artist_name;
      document.getElementById('buy-modal-price').textContent = `₦${song.price}`;
      buyModal.classList.remove('hidden');
    }
    document.getElementById('buy-modal-cancel-btn').addEventListener('click', () => buyModal.classList.add('hidden'));
    document.getElementById('buy-modal-backdrop').addEventListener('click', () => buyModal.classList.add('hidden'));
    
    document.getElementById('buy-modal-pay-btn').addEventListener('click', () => {
      const song = songBeingBought;
      const handler = PaystackPop.setup({
        key: window.PAYSTACK_PUBLIC_KEY,
        email: currentUser.email,
        amount: Math.round(song.price * 100),
        currency: 'NGN',
        ref: `neime_${song.id}_${Date.now()}`,
        callback: (response) => verifyAndUnlock(response.reference, song),
        onClose: () => {}
      });
      handler.openIframe();
    });
    
    async function verifyAndUnlock(reference, song) {
      const { data, error } = await window.sb.functions.invoke('verify-paystack', {
        body: { reference, song_id: song.id, buyer_id: currentUser.id }
      });
      if (error || !data?.success) {
        alert('Payment verification failed: ' + (error?.message || data?.error || 'Unknown error'));
        return;
      }
      buyModal.classList.add('hidden');
      window.playSong(song);
    }
  </script>
</body>
